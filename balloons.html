<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balloon Pop Game for Kids – Free Online | KidsGameHub</title>
<meta name="description" content="Pop colorful balloons before they float away! A free balloon popping game for kids. Tap or click to pop as many as you can in 30 seconds.">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="kids.css">
<style>.sky{position:relative;width:min(92vw,420px);height:380px;overflow:hidden;border-radius:16px;background:linear-gradient(#8fd3ff,#e8f8ff);box-shadow:0 4px 0 rgba(0,0,0,.15)}.bal{position:absolute;bottom:-80px;border:0;background:none;font-size:56px;cursor:pointer;animation:rise 4s linear forwards}@keyframes rise{to{transform:translateY(-480px)}}</style>
</head><body>
<a class="back" href="index.html">← All games</a>
<h1>🎈 Balloon Pop</h1>
<p class="intro">Colorful balloons float up the sky – tap or click them to pop! Pop as many as you can in 30 seconds before they escape.</p>
<div class="stats" id="stat">Press Start!</div><div class="sky" id="sky"></div><button class="btn" id="go">Start</button>
<script>
const sky=document.getElementById('sky'),stat=document.getElementById('stat'),go=document.getElementById('go');
let score=0,t=30,spawn,timer,live=false;
const show=()=>stat.textContent='Time '+t+' · Popped '+score;
function make(){const b=document.createElement('button');b.className='bal';b.textContent='🎈';b.setAttribute('aria-label','Balloon');
 b.style.left=(Math.random()*85)+'%';b.style.filter='hue-rotate('+Math.floor(Math.random()*360)+'deg)';b.style.animationDuration=(3+Math.random()*2)+'s';
 b.onclick=()=>{if(!live||b.dataset.p)return;b.dataset.p=1;score++;show();b.textContent='💥';b.style.filter='none';setTimeout(()=>b.remove(),250);};
 b.addEventListener('animationend',()=>b.remove());sky.appendChild(b);}
function end(){live=false;clearInterval(spawn);clearInterval(timer);sky.innerHTML='';stat.textContent='🎉 Time up! You popped '+score+' balloons!';go.textContent='Play again';}
go.onclick=()=>{clearInterval(spawn);clearInterval(timer);sky.innerHTML='';score=0;t=30;live=true;show();go.textContent='Restart';spawn=setInterval(make,650);timer=setInterval(()=>{t--;show();if(t<=0)end();},1000);};
</script></body></html>
