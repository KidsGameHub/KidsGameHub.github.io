<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match Game for Kids – Play Free Online | KidsGameHub</title>
<meta name="description" content="Play Memory Match free! Flip cards to find matching animal pairs. A fun memory game for kids that builds concentration. No sign-up needed.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:"Trebuchet MS",system-ui,sans-serif; background:#fff8e7; color:#2b2d42; display:flex; flex-direction:column; align-items:center; padding:16px; gap:12px; }
  a.home { align-self:flex-start; color:#2b2d42; font-weight:700; text-decoration:none; }
  h1 { margin:0; font-size:clamp(26px,6vw,38px); }
  .stats { font-size:18px; font-weight:700; }
  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:min(92vw,440px); }
  .card { aspect-ratio:1; border:0; padding:0; background:none; perspective:600px; cursor:pointer; }
  .inner { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .35s; }
  .card.flipped .inner, .card.matched .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:16px; display:flex; align-items:center; justify-content:center; backface-visibility:hidden; box-shadow:0 4px 0 rgba(0,0,0,.15); }
  .front { background:linear-gradient(135deg,#ff6b6b,#ffb703); font-size:clamp(22px,7vw,36px); color:#fff; }
  .back { background:#fff; transform:rotateY(180deg); font-size:clamp(34px,11vw,56px); }
  .card.matched .back { background:#c7f9cc; }
  button.new { background:#06d6a0; color:#04382b; font-weight:700; font-size:18px; border:0; border-radius:999px; padding:10px 22px; cursor:pointer; }
  #win { display:none; background:#fff; border-radius:16px; padding:14px 20px; font-size:20px; font-weight:700; box-shadow:0 4px 0 rgba(0,0,0,.12); text-align:center; }
</style>
<style>.intro{max-width:560px;line-height:1.6;text-align:center;margin:4px 12px}a.home{align-self:flex-start;color:inherit;font-weight:700;text-decoration:none}</style>
</head>
<body>
<a class="home" href="index.html">← All games</a>
<h1>🧠 Memory Match</h1>
<p class="intro">Flip two cards at a time and find all 8 matching animal pairs in as few moves as you can. Memory games can help kids practise concentration and remembering, and they are fun for all ages.</p>
<div class="stats">Moves: <span id="moves">0</span> · Pairs: <span id="pairs">0</span>/8</div>
<div class="board" id="board"></div>
<div id="win"></div>
<button class="new" id="again">New game</button>
<script>
const ICONS=['🐶','🐱','🐼','🦁','🐸','🐵','🦄','🐙'];
const board=document.getElementById('board'),movesEl=document.getElementById('moves'),pairsEl=document.getElementById('pairs'),win=document.getElementById('win');
let first=null,lock=false,moves=0,pairs=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){
  board.innerHTML='';win.style.display='none';first=null;lock=false;moves=0;pairs=0;
  movesEl.textContent=0;pairsEl.textContent=0;
  shuffle([...ICONS,...ICONS]).forEach(icon=>{
    const b=document.createElement('button');b.className='card';b.setAttribute('aria-label','Hidden card');b.dataset.icon=icon;
    b.innerHTML='<div class="inner"><div class="face front">?</div><div class="face back">'+icon+'</div></div>';
    b.addEventListener('click',()=>flip(b));board.appendChild(b);
  });
}
function flip(card){
  if(lock||card===first||card.classList.contains('matched'))return;
  card.classList.add('flipped');
  if(!first){first=card;return;}
  moves++;movesEl.textContent=moves;
  if(first.dataset.icon===card.dataset.icon){
    first.classList.add('matched');card.classList.add('matched');pairs++;pairsEl.textContent=pairs;first=null;
    if(pairs===8){win.textContent='🎉 You found them all in '+moves+' moves!';win.style.display='block';}
  }else{
    lock=true;const a=first;first=null;
    setTimeout(()=>{a.classList.remove('flipped');card.classList.remove('flipped');lock=false;},800);
  }
}
document.getElementById('again').addEventListener('click',start);
start();
</script>
</body>
</html>
