<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Memory Game for Kids – Free Online | KidsGameHub</title>
<meta name="description" content="Play a free pattern memory game. Watch the colors light up, then repeat the pattern. How many rounds can you remember? No sign-up needed.">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="kids.css">
<style>.opt{transition:filter .15s,transform .15s}</style>
</head><body>
<a class="back" href="index.html">← All games</a>
<h1>🌈 Pattern Memory</h1>
<p class="intro">Watch the colored buttons light up, then tap them in the same order. Each round adds one more color to remember. How long a pattern can you copy?</p>
<div class="stats" id="stat">Press Start!</div><div class="opts" id="opts"></div><div id="msg"></div><button class="btn" id="go">Start</button>
<script>
const $=id=>document.getElementById(id),opts=$('opts'),msg=$('msg'),stat=$('stat'),go=$('go');
const cols=['#e63946','#1d70f5','#2dc653','#ffd60a'],names=['Red','Blue','Green','Yellow'];
const btns=cols.map((c,i)=>{const b=document.createElement('button');b.className='opt';b.style.background=c;b.setAttribute('aria-label',names[i]);b.disabled=true;b.onclick=()=>press(i);opts.appendChild(b);return b;});
let seq=[],pos=0,gen=0;
const lock=v=>btns.forEach(b=>b.disabled=v);
function flash(i){const b=btns[i];b.style.filter='brightness(1.7)';b.style.transform='scale(.94)';setTimeout(()=>{b.style.filter='';b.style.transform='';},350);}
function round(){const g=++gen;seq.push(Math.floor(Math.random()*4));pos=0;stat.textContent='Round '+seq.length;msg.textContent='Watch…';lock(true);
 seq.forEach((s,k)=>setTimeout(()=>{if(g===gen)flash(s);},700*(k+1)));
 setTimeout(()=>{if(g===gen){msg.textContent='Your turn!';lock(false);}},700*seq.length+500);}
function press(i){flash(i);if(i!==seq[pos]){lock(true);gen++;msg.textContent='Oops! You reached round '+seq.length+' 🎉';go.textContent='Play again';return;}
 pos++;if(pos===seq.length){lock(true);msg.textContent='✅ Great!';const g=gen;setTimeout(()=>{if(g===gen)round();},900);}}
go.onclick=()=>{seq=[];go.textContent='Restart';round();};
</script></body></html>
